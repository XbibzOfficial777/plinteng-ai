name: Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 0.1.0)'
        default: '0.1.0'
        type: string
      build_number:
        description: 'Build number (e.g. 1)'
        default: '1'
        type: string
      publish_release:
        description: 'Publish APKs to GitHub Releases'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.3.1'

jobs:
  # ------------------------------------------------------------------
  # Validation: analyze + unit/widget tests on every push/PR
  # ------------------------------------------------------------------
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter cache
        run: flutter precache --android

      - name: Get dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Build: APK arm64 + arm32 + universal (release only)
  # ------------------------------------------------------------------
  build:
    name: Build APKs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter cache
        run: flutter precache --android

      - name: Get dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure version
        id: version
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '0.1.0' }}"
          BUILD_NUMBER="${{ github.event.inputs.build_number || '1' }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build APK — arm64 (android-arm64)
        run: |
          flutter build apk \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --target-platform android-arm64 \
            --release
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build APK — arm32 (android-arm)
        run: |
          flutter build apk \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --target-platform android-arm \
            --release
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build APK — universal (all ABIs)
        run: |
          flutter build apk \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --release
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs with ABI suffix
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          VN="${{ steps.version.outputs.version_name }}"
          for f in *.apk; do
            [ "$f" = "app-arm64-v8a-release.apk" ] && mv "$f" "plinteng-ai-arm64-$VN.apk"
            [ "$f" = "app-armeabi-v7a-release.apk" ] && mv "$f" "plinteng-ai-arm32-$VN.apk"
            [ "$f" = "app-release.apk" ] && mv "$f" "plinteng-ai-universal-$VN.apk"
          done
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plinteng-ai-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # Publish: upload APKs to GitHub Releases
  # ------------------------------------------------------------------
  publish:
    name: Publish to Releases
    needs: build
    if: github.event.inputs.publish_release == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: plinteng-ai-apk-release
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          release_name: Plinteng AI v${{ github.event.inputs.version_name }}
          body: |
            ## Plinteng AI v${{ github.event.inputs.version_name }}

            ### APK Variants
            - **arm64** — for 64-bit ARM devices (most modern phones)
            - **arm32** — for 32-bit ARM devices
            - **universal** — for all ARM devices (arm64 + arm32)

            Auto-built from commit `${{ github.sha }}`.
          files: |
            apks/*.apk
          draft: false
          prerelease: false
